name: Release

on:
  push:
    tags:
      - 'v*'

# Generic across projects: the repo's `make dist` decides what gets built and
# what lands in dist/; this workflow only tags, uploads and writes notes.
jobs:
  release:
    name: Create GitHub Release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build release artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: make dist VERSION="${TAG_NAME#v}"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --title "Release $TAG_NAME" \
            --generate-notes
